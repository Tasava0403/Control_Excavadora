<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151b">
  <title>Control · Excavadora IoT</title>
  <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./assets/images/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./assets/images/favicon-180.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div class="app">
  <header class="app__header">
    <div class="brand">
      <img src="./assets/images/favicon.svg" alt="" width="28" height="28">
      <h1 id="vehiculo-nombre" class="h6 mb-0">Cargando vehículo…</h1>
    </div>
    <ul class="status-list" aria-label="Estado de las conexiones">
      <li id="st-ws" class="status"><i class="bi" aria-hidden="true"></i><span class="status__label">WebSocket WSS</span><strong class="status__value"></strong></li>
      <li id="st-aws" class="status"><i class="bi" aria-hidden="true"></i><span class="status__label">Servidor AWS · API de 21 servicios</span><strong class="status__value"></strong></li>
      <li id="st-rds" class="status"><i class="bi" aria-hidden="true"></i><span class="status__label">Amazon RDS</span><strong class="status__value"></strong></li>
    </ul>
  </header>

  <main>
    <section class="pad pad--v" aria-labelledby="t-v">
      <h2 id="t-v" class="pad__title">Vehículo</h2>
      <div id="joy-v" class="joystick" role="application" tabindex="0" aria-label="Joystick del vehículo: flechas para avanzar, retroceder y girar"></div>
      <p id="dir-v" class="pad__dir">Neutro</p>
    </section>

    <section class="pad pad--a" aria-labelledby="t-a">
      <h2 id="t-a" class="pad__title">Brazo y pala</h2>
      <div id="joy-a" class="joystick" role="application" tabindex="0" aria-label="Joystick del brazo y la pala: flechas para subir, bajar y girar la pala"></div>
      <p id="dir-a" class="pad__dir">Neutro</p>
    </section>

    <section class="actions" aria-label="Controles">
      <button type="button" class="cmd" data-cmd="CONTROL_LED" aria-label="LED" title="LED"><i class="bi bi-lightbulb-fill" aria-hidden="true"></i><i class="cmd__badge bi" aria-hidden="true"></i></button>
      <button type="button" class="cmd" data-cmd="CONTROL_SONIDO" aria-label="Sonido" title="Sonido"><i class="bi bi-volume-up-fill" aria-hidden="true"></i><i class="cmd__badge bi" aria-hidden="true"></i></button>
      <button type="button" id="btn-demo" class="cmd" aria-label="DEMO" title="DEMO" aria-haspopup="dialog"><i class="bi bi-collection-play-fill" aria-hidden="true"></i><i class="cmd__badge bi" aria-hidden="true"></i></button>
      <button type="button" class="cmd cmd--stop" data-cmd="DETENER" aria-label="DETENER" title="DETENER"><i class="bi bi-stop-circle-fill" aria-hidden="true"></i><i class="cmd__badge bi" aria-hidden="true"></i></button>
    </section>
  </main>

  <footer class="credits">Desarrollado por Octavio Salas Nava · 2026</footer>
</div>

<dialog id="demo-dialog" class="demo-dialog" aria-labelledby="demo-titulo">
  <div class="demo-dialog__head">
    <h2 id="demo-titulo" class="h6 mb-0"><i class="bi bi-collection-play-fill" aria-hidden="true"></i> DEMO</h2>
    <button type="button" id="demo-cerrar" class="btn-close" aria-label="Cerrar"></button>
  </div>
  <label for="demo-select" class="visually-hidden">Seleccionar DEMO</label>
  <select id="demo-select" class="form-select" disabled><option>Cargando DEMO…</option></select>
  <div class="demo-dialog__btns">
    <button id="demo-iniciar" type="button" class="btn btn-warning" disabled><i class="bi bi-play-fill" aria-hidden="true"></i> Iniciar</button>
    <button id="demo-cancelar" type="button" class="btn btn-outline-light" disabled><i class="bi bi-x-lg" aria-hidden="true"></i> Cancelar</button>
  </div>
  <p id="demo-estado" class="demo-dialog__estado" aria-live="polite">Sin DEMO en ejecución</p>
</dialog>

<div id="toast" class="toast-msg" role="status" aria-live="polite"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
